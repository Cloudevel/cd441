# Ejecuta los cuadernos compatibles con un contenedor dentro del mismo
# devcontainer que usan los estudiantes (Python 3.12, kernels de Python y Bash).
# Es independiente de ci.yml (la CI de la API). Ejecuta TODOS los cuadernos, el 16
# y el 17 incluidos. No usa credenciales ni servicios externos: las celdas que
# necesitan un proyecto de Google Cloud, GHCR o un anfitrión por SSH llevan la
# etiqueta de celda «skip-execution» y el script las omite (y cuenta). Detalle en
# docs/CI_CUADERNOS.md. scripts/cuadernos_omitidos.txt (hoy vacío) admite omitir
# cuadernos enteros.
name: Cuadernos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versión fija del CLI de Dev Containers (actualizar a mano).
  DEVCONTAINER_CLI: "@devcontainers/cli@0.91.0"

jobs:
  cuadernos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir y levantar el devcontainer
        run: npx --yes "${DEVCONTAINER_CLI}" up --workspace-folder .

      - name: Ejecutar los cuadernos
        run: >-
          npx --yes "${DEVCONTAINER_CLI}" exec --workspace-folder .
          python scripts/ejecutar_cuadernos.py
          --omitir scripts/cuadernos_omitidos.txt --timeout 300
