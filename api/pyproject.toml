# Configuración de herramientas de la API de ejemplo (cd441 · Cloudevel).
# No se empaqueta como distribución: el artefacto de despliegue es la imagen.
[project]
name = "cd441-api"
version = "0.1.0"
description = "API de demostración del curso cd441 (Cloudevel)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/W/F: estilo y errores · I: orden de imports · UP: sintaxis moderna
# B: errores frecuentes (bugbear) · S: reglas de seguridad (bandit)
select = ["E", "F", "I", "UP", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# En pruebas, `assert` y credenciales de juguete son lo esperado.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
